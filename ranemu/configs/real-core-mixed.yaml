# ranemu — 실 5G 코어 시험검증 설정 (혼합 feature 시나리오)
#
# 사용법
#   python3 -m ranemu.cli plan -c ranemu/configs/real-core-mixed.yaml   # 미리보기
#   python3 -m ranemu.cli run  -c ranemu/configs/real-core-mixed.yaml   # 실제 주입
#
# ★ 실코어에 붙이기 전에 반드시 채워야 하는 값 (아래 TODO)
#   1) core.amf_addr / amf_port        : AMF 의 N2(NGAP/SCTP) 주소
#   2) gnb.mcc / mnc / tac / gnb_id    : 코어에 등록된 gNB 파라미터와 일치해야 함
#   3) security.key / opc              : UDM/UDR 에 프로비저닝된 SIM 자격증명
#   4) ue_groups[].imsi_start          : UDM 에 등록된 IMSI 대역
#   5) traffic.dest_addr               : N6 너머 실제로 응답하는 서버
#
# 값이 코어와 어긋나면 나타나는 증상
#   · PLMN/TAC 불일치  → NGSetupFailure
#   · IMSI 미등록      → RegistrationReject
#   · K/OPc 불일치     → AUTN MAC 불일치(에뮬레이터가 명시적으로 보고)
#   · 슬라이스 미허용  → PDU 세션 거절

name: real-core-mixed
seed: 42
out_dir: /tmp/ranemu_runs

core:
  kind: real
  amf_addr: 10.1.16.10        # TODO: 실제 AMF N2 주소
  amf_port: 38412
  upf_port: 2152              # UPF 주소는 코어가 세션수립에서 알려주므로 지정 불필요

gnb:
  name: ranemu-gnb-1
  mcc: "450"                  # TODO: 코어 PLMN 과 일치
  mnc: "05"
  gnb_id: 1
  gnb_id_bits: 24
  tac: 1                      # TODO: 코어가 허용하는 TAC
  cell_id: 0
  n2_local_addr: 0.0.0.0      # gNB 로서 바인드할 로컬 주소
  n3_local_addr: 0.0.0.0
  n3_local_port: 2152         # 1024 미만이라 root 권한 필요(없으면 높은 포트로)
  # n3_advertise_addr: 10.1.16.52   # 0.0.0.0 바인드 시 코어에 알릴 실제 IP
  paging_drx: v128
  slices:
    - {sst: 1, sd: null}
    - {sst: 2, sd: "000001"}

security:
  key: "465b5ce8b199b49faa5f0a2ee238a6bc"   # TODO: 실제 Ki
  opc: "cd63cb71954a9f4e48a5994e37a02baf"   # TODO: 실제 OPc (또는 op: 로 OP 지정)
  amf: "8000"
  suci_scheme: "null"          # 코어가 null scheme(평문 SUCI)을 허용해야 함
  # supported_enc / supported_int 를 비워 두면 구현된 알고리즘만 광고한다
  # (현재 NEA0/NEA2, NIA0/NIA2). 코어가 SNOW3G/ZUC 만 허용하면 등록이 실패한다.

# ─────────────────────────────────────────────────────────────────────────────
# 단말 그룹 — 기지국이 제공하는 5G-A/6G feature 별로 나눈다
#   traffic: fullbuffer  → 그 feature 의 '최대 처리량' 을 검증
#   traffic 생략         → feature 고유의 트래픽 패턴(IoT 주기, XR 프레임 등)을 재현
# ─────────────────────────────────────────────────────────────────────────────
ue_groups:
  # ① 기준선: 일반 eMBB 단말
  - name: embb
    count: 2
    imsi_start: "450050000000001"
    features: []
    traffic: fullbuffer
    dnn: internet
    sst: 1

  # ② RedCap (Rel-17 NR-Light) — 20MHz/1레이어/64QAM/HD-FDD
  #    코어 검증 포인트: 낮은 UE-AMBR 적용, 축소된 UE 무선능력 저장
  - name: redcap-r17
    count: 4
    imsi_start: "450050000000011"
    features: [redcap]
    feature_params:
      redcap: {variant: rel17, rx_branches: 1, half_duplex: true}
    traffic: fullbuffer
    ramp_seconds: 2.0

  # ③ eRedCap (Rel-18) — 5MHz 로 더 축소
  - name: redcap-r18
    count: 2
    imsi_start: "450050000000021"
    features: [redcap]
    feature_params:
      redcap: {variant: rel18}
    traffic: fullbuffer

  # ④ NTN GEO 위성 — 편도 238ms, NAS 타이머 4배 연장
  #    코어 검증 포인트: 큰 RTT 에서 절차 타임아웃이 나지 않는가
  - name: ntn-geo
    count: 2
    imsi_start: "450050000000031"
    features: [ntn]
    feature_params:
      ntn: {orbit: geo, nas_timer_scale: 4.0}
    traffic: fullbuffer

  # ⑤ NTN LEO — 짧은 지연이지만 20초마다 셀 전환 단절
  #    코어 검증 포인트: 주기적 단절 중 세션 유지
  - name: ntn-leo
    count: 2
    imsi_start: "450050000000041"
    features: [ntn]
    feature_params:
      ntn: {orbit: leo, handover_interruption_ms: 50}
    traffic: fullbuffer

  # ⑥ URLLC — 5QI 82, 1ms 주기 제어 트래픽
  - name: urllc
    count: 2
    imsi_start: "450050000000051"
    features: [urllc]
    sst: 2
    sd: "000001"

  # ⑦ XR (Rel-18) — 90fps 프레임 버스트, 5QI 87
  - name: xr
    count: 1
    imsi_start: "450050000000061"
    features: [xr]
    feature_params:
      xr: {fps: 90, offered_dl_mbps: 45}

  # ⑧ mMTC — eDRX 655초, 분당 100바이트
  - name: mmtc
    count: 4
    imsi_start: "450050000000071"
    features: [mmtc]
    ramp_seconds: 5.0

traffic:
  duration: 60.0
  dest_addr: 8.8.8.8          # TODO: N6 너머 실제 응답 서버
  dest_port: 33434
  packet_size: 1400
  offered_ul_mbps: 200.0      # feature 상한과 min() 으로 적용
  offered_dl_mbps: 800.0
  downlink_mode: echo         # 실코어에서는 echo 또는 none (loopback 은 스텁 전용)

# 코어측 수집 — 기존 network_agent/dpi_engine/ngap_agent 파이프라인을 그대로 사용
capture:
  enabled: true
  interface: dual             # N6/N3 분리 캡처(메모리에 기록된 이 테스트베드 규약)
  out_dir: /tmp/ranemu_captures
  auto_analyze: true          # 종료 후 자동으로 주입값과 대조
  snaplen: 256
  n2_snaplen: 0               # N2 는 반드시 풀 스냅렌(NGAP IE 파싱)

procedure_timeout: 10.0
